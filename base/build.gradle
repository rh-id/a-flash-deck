plugins {
    alias(libs.plugins.android.library)
}

android {
    compileSdk = 37

    defaultConfig {
        minSdk 23

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation":
                                      "$projectDir/schemas".toString()]
            }
        }
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'm.co.rh.id.a_flash_deck.base'
}

dependencies {
    api libs.room.runtime
    annotationProcessor libs.room.compiler

    api libs.a.provider
    api libs.a.navigator
    api libs.a.logger
    api libs.rx.utils
    api libs.rxandroid
    api libs.rxjava
    api libs.androidx.appcompat
    api libs.material
    api libs.androidx.constraintlayout
    api libs.androidx.drawerlayout
    api libs.androidx.swiperefreshlayout
    api libs.androidx.recyclerview
    api libs.androidx.exifinterface
    api libs.work.runtime

    implementation libs.photo.view
    implementation libs.concurrent.utils

    // Markwon — markdown rendering for card Q/A (latex + autolinks)
    api libs.markwon.core
    api libs.markwon.ext.tables
    api libs.markwon.ext.strikethrough
    api libs.markwon.ext.tasklist
    api libs.markwon.linkify
    api libs.markwon.ext.latex
    api libs.markwon.inline.parser

    coreLibraryDesugaring libs.desugar.jdk.libs

    testImplementation libs.junit
    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.room.testing
}