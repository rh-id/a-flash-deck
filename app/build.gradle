plugins {
    alias(libs.plugins.android.application)
}

apply from: '../gradle/license-html-generator.gradle'

def keyStoreFile = File.createTempFile("key", null)
keyStoreFile.deleteOnExit()

if (System.getenv("SIGNING_KEY") != null) {
    println 'key exist'
    keyStoreFile.bytes = Base64.decoder.decode(System.getenv("SIGNING_KEY"))
} else {
    println 'key NOT exist'
}

android {
    compileSdk = 37

    signingConfigs {
        release {
            storeFile keyStoreFile
            storePassword System.getenv("KEY_STORE_PASSWORD")
            keyAlias System.getenv("ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    defaultConfig {
        applicationId "m.co.rh.id.a_flash_deck"
        minSdk 23
        targetSdk 37
        versionCode 64
        versionName "2.4.0"
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("SIGNING_KEY") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'm.co.rh.id.a_flash_deck'
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs

    implementation project(path: ':base')
    implementation project(path: ':timer-notification')
    implementation project(path: ':bot')
    implementation project(path: ':ai')
    implementation libs.leakcanary.plumber
    // decompress-only zstd used by ApkgParser for modern .apkg packages
    // (collection.anki21b and media are zstd compressed). The reference
    // libzstd binding decodes every standard frame; pure-Java alternatives
    // (aircompressor) either need JDK 22+ or are unverified against
    // real-world frames. The aar ships Android 5.0+ natives for all ABIs
    // (~1.2MB per ABI in the APK). Version catalogs cannot declare the
    // aar artifact type, so it is selected here per Gradle docs.
    implementation(libs.zstd.jni) {
        artifact {
            name = 'zstd-jni'
            type = 'aar'
        }
    }

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.mockito.core
    androidTestImplementation libs.room.testing
}

project.afterEvaluate {
    def versionCode = android.defaultConfig.versionCode
    File changeLogTxt = new File(project.rootDir, "fastlane/metadata/android/en-US/changelogs/" + versionCode + ".txt")
    if (changeLogTxt.exists()) {
        def outputChangeLog = project.layout.buildDirectory.file("changelog.txt").get().asFile
        if (!outputChangeLog.exists()) {
            outputChangeLog.parentFile.mkdirs()
            outputChangeLog.createNewFile()
        }
        outputChangeLog.bytes = changeLogTxt.bytes
    }
}
